<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Begotten Wargame — Редактор армии</title>
<style>
  :root{--bg:#14161a;--panel:#1c1f26;--panel2:#232733;--line:#333947;--txt:#e6e8ee;--dim:#9aa3b5;--acc:#c9a227;--red:#c0392b;}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.45 "Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--txt);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  header h1{font-size:16px;margin:0;color:var(--acc);letter-spacing:.5px}
  header .sp{flex:1}
  button{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px}
  button:hover{border-color:var(--acc)}
  button.primary{background:var(--acc);color:#111;border-color:var(--acc);font-weight:600}
  button.danger{color:#ff8b7d}
  button:disabled{opacity:.5;cursor:default}
  main{flex:1;display:flex;min-height:0}
  #side{width:280px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:10px}
  .fac{margin-bottom:6px}
  .fac-head{display:flex;align-items:center;gap:6px;padding:7px 9px;border-radius:6px;background:var(--panel2);cursor:pointer;font-weight:600}
  .fac-head:hover{border-color:var(--acc)}
  .fac-head .x{margin-left:auto;color:var(--dim);font-weight:400}
  .fac-head .x:hover{color:var(--red)}
  .unit{padding:5px 9px 5px 20px;border-radius:5px;cursor:pointer;color:var(--dim)}
  .unit:hover{background:var(--panel2);color:var(--txt)}
  .unit.sel{background:var(--panel2);color:var(--acc)}
  .addlink{color:var(--acc);cursor:pointer;font-size:12.5px;padding:4px 9px 4px 20px;display:block}
  #editor{flex:1;overflow-y:auto;padding:18px 22px}
  #editor .empty{color:var(--dim);margin-top:40px;text-align:center}
  h2{margin:0 0 4px;font-size:19px}
  .sub{color:var(--dim);font-size:12.5px;margin-bottom:16px}
  fieldset{border:1px solid var(--line);border-radius:8px;margin:0 0 16px;padding:12px 14px;background:var(--panel)}
  legend{color:var(--acc);font-size:12.5px;padding:0 6px;text-transform:uppercase;letter-spacing:.5px}
  label{display:block;font-size:12px;color:var(--dim);margin:8px 0 3px}
  input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:5px;padding:6px 8px;font:inherit}
  textarea{min-height:64px;resize:vertical}
  .row{display:flex;gap:10px}.row>div{flex:1}
  table{width:100%;border-collapse:collapse;margin-top:6px;font-size:13px}
  th{color:var(--dim);font-weight:500;text-align:left;font-size:11.5px;padding:3px 4px;text-transform:uppercase}
  td{padding:3px 4px;border-top:1px solid var(--line);vertical-align:middle}
  td input,td select{padding:4px 6px}
  .mini{width:52px}.stat{width:56px}
  .delrow{color:var(--dim);cursor:pointer;border:none;background:none;font-size:15px;padding:2px 4px}
  .delrow:hover{color:var(--red)}
  .toolbar{display:flex;gap:10px;margin:4px 0 16px;align-items:center}
  #toast{position:fixed;bottom:18px;right:18px;background:var(--panel2);border:1px solid var(--acc);border-radius:8px;padding:10px 16px;display:none;max-width:520px;white-space:pre-wrap;font-size:12.5px}
  .weapick{display:flex;flex-wrap:wrap;gap:8px}
  .weapick label{display:flex;align-items:center;gap:4px;margin:0;color:var(--txt);font-size:12.5px}
  .weapick input{width:auto}
</style>
</head>
<body>
<header>
  <h1>⚜ BEGOTTEN WARGAME — Редактор армии</h1>
  <span class="sp"></span>
  <button id="btnNewFac">＋ Фракция</button>
  <button class="primary" id="btnPublish">⇪ Опубликовать в NewRecruit</button>
</header>
<main>
  <div id="side"></div>
  <div id="editor"><div class="empty">Выбери юнит слева или создай новый.</div></div>
</main>
<div id="toast"></div>
<script>
let DB=null, sel={fac:null,unit:null}, dirty=false;

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const slug=s=>s.toLowerCase().trim().replace(/[^a-zа-яё0-9]+/gi,"_").replace(/^_+|_+$/g,"")||"unit_"+Date.now();
function toast(t,ms=4000){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",ms);}

async function api(path,body){
  const r=await fetch(path,{method:body?"POST":"GET",headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  return r.json();
}
async function load(){DB=await api("/api/data");renderSide();renderEditor();}

function renderSide(){
  const el=$("#side");let h="";
  DB.factions.forEach((f,fi)=>{
    h+=`<div class="fac"><div class="fac-head" data-f="${fi}">${esc(f.name)}<span class="x" data-delfac="${fi}" title="Удалить фракцию">✕</span></div>`;
    (f.units||[]).forEach((u,ui)=>{
      const on=sel.fac===fi&&sel.unit===ui?" sel":"";
      h+=`<div class="unit${on}" data-f="${fi}" data-u="${ui}">${esc(u.name)}</div>`;
    });
    h+=`<span class="addlink" data-addunit="${fi}">＋ юнит</span></div>`;
  });
  el.innerHTML=h;
  el.querySelectorAll(".unit").forEach(e=>e.onclick=()=>{pick(+e.dataset.f,+e.dataset.u)});
  el.querySelectorAll("[data-addunit]").forEach(e=>e.onclick=()=>{addUnit(+e.dataset.addunit)});
  el.querySelectorAll("[data-delfac]").forEach(e=>e.onclick=async ev=>{ev.stopPropagation();
    if(!confirm("Удалить фракцию целиком?"))return;
    await api("/api/faction/delete",{id:DB.factions[+e.dataset.delfac].id});
    sel={fac:null,unit:null};await load();toast("Фракция удалена");});
}
function pick(f,u){ if(dirty&&!confirm("Есть несохранённые правки. Потерять их?"))return; dirty=false; sel={fac:f,unit:u}; renderSide(); renderEditor(); }

function addUnit(fi){
  const f=DB.factions[fi];
  f.units=f.units||[];
  const st=()=>Object.fromEntries(DB.system.statsModel.map(s=>[s,"-"]));
  f.units.push({id:slug("unit_"+f.units.length),name:"Новый юнит",category:DB.system.categories[1]?.id||"troops",
    points:0,keywords:[],lore:"",
    models:[
      {name:"Сержант",leader:true,min:1,max:1,pointsPerModel:0,stats:st(),weapons:[],options:[],choices:[]},
      {name:"Боец",leader:false,min:4,max:9,pointsPerModel:0,stats:st(),weapons:[],options:[],choices:[]}
    ],weapons:[],options:[],abilities:[]});
  saveFaction(f).then(()=>{sel={fac:fi,unit:f.units.length-1};load();});
}

async function saveFaction(f){
  const r=await api("/api/faction/save",f);
  if(!r.ok)toast("Ошибка сохранения: "+r.error);else dirty=false;
  return r;
}

// ---------- РЕДАКТОР ----------
function renderEditor(){
  const ed=$("#editor");
  if(sel.fac==null||sel.unit==null){ed.innerHTML='<div class="empty">Выбери юнит слева или создай новый.</div>';return;}
  const F=DB.factions[sel.fac],U=F.units[sel.unit];
  const cats=DB.system.categories;
  const wopts=U.weapons.map(w=>`<option value="${esc(w.id)}">${esc(w.name)}</option>`).join("");
  ed.innerHTML=`
  <h2>${esc(U.name)}</h2><div class="sub">${esc(F.name)} · id: ${esc(U.id)}</div>
  <div class="toolbar">
    <button class="primary" id="save">💾 Сохранить</button>
    <button class="danger" id="delunit">Удалить юнит</button>
    <span id="dirty" style="color:var(--dim);font-size:12px"></span>
  </div>
  <fieldset><legend>Основное</legend>
    <div class="row"><div><label>Название</label><input id="f_name" value="${esc(U.name)}"></div>
    <div><label>Категория</label><select id="f_cat">${cats.map(c=>`<option value="${c.id}" ${U.category===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select></div>
    <div style="max-width:140px"><label>Базовые очки</label><input id="f_pts" type="number" value="${U.points||0}"></div></div>
    <label>Кейворды (через запятую)</label><input id="f_kw" value="${esc((U.keywords||[]).join(", "))}">
    <label>Описание / лор</label><textarea id="f_lore">${esc(U.lore||"")}</textarea>
  </fieldset>

  <fieldset><legend>Состав отряда и характеристики</legend>
    <table id="t_models"><tr><th>Модель</th><th title="Сержант/командир — всегда 1 в отряде">Серж.</th><th>Мин</th><th>Макс</th><th>Очки/мод</th>${DB.system.statsModel.map(s=>`<th class="stat">${s}</th>`).join("")}<th>Оружие</th><th></th></tr></table>
    <button id="addmodel" style="margin-top:8px">＋ строка модели</button>
  </fieldset>

  <fieldset><legend>Оружие</legend>
    <table id="t_weap"><tr><th style="width:90px">id</th><th>Название</th>${DB.system.statsWeapon.map(s=>`<th class="stat">${s}</th>`).join("")}<th>Особенности</th><th></th></tr></table>
    <button id="addweap" style="margin-top:8px">＋ оружие</button>
  </fieldset>

  <fieldset><legend>Опции снаряжения</legend>
    <div class="sub" style="margin:2px 0 6px">«1 на каждые N моделей» — заполни колонку N. «Группа» — строки с одинаковой группой образуют выбор 1 из N (например, оружие сержанта); без группы — просто лимит «Макс».</div>
    <table id="t_opts"><tr><th>Модель</th><th>Название опции</th><th>Группа</th><th>Оружие</th><th class="mini">1 на N</th><th class="mini">Макс</th><th class="mini">Очки</th><th></th></tr></table>
    <button id="addopt" style="margin-top:8px">＋ опция</button>
  </fieldset>

  <fieldset><legend>Способности / особенности</legend>
    <table id="t_ab"><tr><th style="width:220px">Название</th><th>Текст</th><th></th></tr></table>
    <button id="addab" style="margin-top:8px">＋ способность</button>
  </fieldset>`;

  const mark=()=>{dirty=true;$("#dirty").textContent="● несохранённые изменения";};
  ed.querySelectorAll("input,select,textarea").forEach(e=>e.addEventListener("input",mark));

  // модели
  const tm=$("#t_models");
  U.models.forEach((m,i)=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td><input data-m="${i}" data-k="name" value="${esc(m.name)}"></td>
      <td style="text-align:center"><input type="checkbox" data-m="${i}" data-k="leader" ${m.leader?"checked":""}></td>
      <td><input class="mini" type="number" data-m="${i}" data-k="min" value="${m.min}"></td>
      <td><input class="mini" type="number" data-m="${i}" data-k="max" value="${m.max}"></td>
      <td><input class="mini" type="number" data-m="${i}" data-k="pointsPerModel" value="${m.pointsPerModel}"></td>
      ${DB.system.statsModel.map(s=>`<td><input class="stat" data-m="${i}" data-stat="${s}" value="${esc(m.stats[s]??"-")}"></td>`).join("")}
      <td><div class="weapick">${U.weapons.map(w=>`<label><input type="checkbox" data-m="${i}" data-w="${esc(w.id)}" ${m.weapons.includes(w.id)?"checked":""}>${esc(w.name)}</label>`).join("")}</div></td>
      <td><button class="delrow" data-delmodel="${i}">✕</button></td>`;
    tm.appendChild(tr);
  });
  // оружие
  const tw=$("#t_weap");
  U.weapons.forEach((w,i)=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td><input data-wi="${i}" data-k="id" value="${esc(w.id)}"></td>
      <td><input data-wi="${i}" data-k="name" value="${esc(w.name)}"></td>
      ${DB.system.statsWeapon.map(s=>`<td><input class="stat" data-wi="${i}" data-k="${s}" value="${esc(w[s]??"-")}"></td>`).join("")}
      <td><input data-wi="${i}" data-k="abilities" value="${esc(w.abilities||"")}"></td>
      <td><button class="delrow" data-delweap="${i}">✕</button></td>`;
    tw.appendChild(tr);
  });
  // опции: плоский список, собранный из моделей (options + choices) + старые unit.options
  if(!U._flat){
    U._flat=[];
    U.models.forEach((m,mi)=>{
      (m.options||[]).forEach(o=>U._flat.push({mi,group:"",name:o.name||"",weapon:o.takeWeapon||"",perN:o.perModels||0,max:o.max||1,points:o.points||0}));
      (m.choices||[]).forEach(ch=>(ch.options||[]).forEach(o=>U._flat.push({mi,group:ch.name,name:"",weapon:o.weapon||"",perN:0,max:1,points:o.points||0})));
    });
    (U.options||[]).forEach(o=>{ // старый формат — к первой не-сержантской модели
      let mi=U.models.findIndex(m=>!m.leader); if(mi<0)mi=0;
      U._flat.push({mi,group:"",name:o.name||"",weapon:o.takeWeapon||"",perN:o.perModels||0,max:o.max||1,points:o.points||0});
    });
    U.options=[];
  }
  const to=$("#t_opts");
  U._flat.forEach((r,i)=>{
    const tr=document.createElement("tr");
    const msel=U.models.map((m,j)=>`<option value="${j}" ${r.mi===j?"selected":""}>${esc(m.name)}</option>`).join("");
    const wsel=U.weapons.map(w=>`<option value="${esc(w.id)}" ${r.weapon===w.id?"selected":""}>${esc(w.name)}</option>`).join("");
    tr.innerHTML=`<td><select data-oi="${i}" data-k="mi">${msel}</select></td>
      <td><input data-oi="${i}" data-k="name" value="${esc(r.name)}" ${r.group?"disabled placeholder='(из группы)'":""}></td>
      <td><input data-oi="${i}" data-k="group" value="${esc(r.group)}" placeholder="—"></td>
      <td><select data-oi="${i}" data-k="weapon"><option value="">—</option>${wsel}</select></td>
      <td><input class="mini" type="number" data-oi="${i}" data-k="perN" value="${r.perN||0}"></td>
      <td><input class="mini" type="number" data-oi="${i}" data-k="max" value="${r.max||1}"></td>
      <td><input class="mini" type="number" data-oi="${i}" data-k="points" value="${r.points||0}"></td>
      <td><button class="delrow" data-delopt="${i}">✕</button></td>`;
    to.appendChild(tr);
  });
  // способности
  const ta=$("#t_ab");
  U.abilities.forEach((a,i)=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td><input data-ai="${i}" data-k="name" value="${esc(a.name)}"></td>
      <td><input data-ai="${i}" data-k="text" value="${esc(a.text)}"></td>
      <td><button class="delrow" data-delab="${i}">✕</button></td>`;
    ta.appendChild(tr);
  });

  const rebind=()=>{collect();renderEditor();mark();};
  $("#addmodel").onclick=()=>{collect();U.models.push({name:"Боец",leader:false,min:1,max:1,pointsPerModel:0,stats:Object.fromEntries(DB.system.statsModel.map(s=>[s,"-"])),weapons:[],options:[],choices:[]});renderEditor();mark();};
  $("#addweap").onclick=()=>{collect();U.weapons.push({id:slug("w"+U.weapons.length),name:"Новое оружие",S:"-",AP:"-",A:"-",D:"-",abilities:""});renderEditor();mark();};
  $("#addopt").onclick=()=>{collect();U._flat.push({mi:0,group:"",name:"Новая опция",weapon:"",perN:0,max:1,points:0});renderEditor();mark();};
  $("#addab").onclick=()=>{collect();U.abilities.push({name:"Новая способность",text:""});renderEditor();mark();};
  ed.querySelectorAll("[data-delmodel]").forEach(b=>b.onclick=()=>{collect();const di=+b.dataset.delmodel;
    U.models.splice(di,1);
    U._flat.forEach(r=>{if(r.mi===di)r.mi=0;else if(r.mi>di)r.mi--;});
    renderEditor();mark();});
  ed.querySelectorAll("[data-delweap]").forEach(b=>b.onclick=()=>{collect();U.weapons.splice(+b.dataset.delweap,1);renderEditor();mark();});
  ed.querySelectorAll("[data-delopt]").forEach(b=>b.onclick=()=>{collect();U._flat.splice(+b.dataset.delopt,1);renderEditor();mark();});
  ed.querySelectorAll("[data-delab]").forEach(b=>b.onclick=()=>{collect();U.abilities.splice(+b.dataset.delab,1);renderEditor();mark();});

  $("#save").onclick=async()=>{collect();
    // распределяем плоские опции обратно по моделям
    U.models.forEach(m=>{m.options=[];m.choices=[];});
    U._flat.forEach(r=>{
      const m=U.models[r.mi]||U.models[0];if(!m)return;
      if(r.group){
        let ch=m.choices.find(c=>c.name===r.group);
        if(!ch){ch={name:r.group,options:[]};m.choices.push(ch);}
        if(r.weapon)ch.options.push({weapon:r.weapon,points:r.points||0});
      }else if(r.weapon){
        m.options.push({name:r.name||"Опция",takeWeapon:r.weapon,perModels:r.perN||0,max:r.max||1,points:r.points||0});
      }
    });
    delete U._flat;
    await saveFaction(F);toast("Сохранено: "+U.name);renderSide();};
  $("#delunit").onclick=async()=>{if(!confirm("Удалить юнит «"+U.name+"»?"))return;
    F.units.splice(sel.unit,1);await saveFaction(F);sel={fac:null,unit:null};await load();toast("Юнит удалён");};

  function collect(){
    U.name=$("#f_name").value;U.category=$("#f_cat").value;U.points=+$("#f_pts").value||0;
    U.keywords=$("#f_kw").value.split(",").map(s=>s.trim()).filter(Boolean);
    U.lore=$("#f_lore").value;
    ed.querySelectorAll("[data-m]").forEach(e=>{
      const m=U.models[+e.dataset.m];
      if(e.dataset.k)m[e.dataset.k]=e.type==="number"?+e.value:(e.type==="checkbox"?e.checked:e.value);
      else if(e.dataset.stat)m.stats[e.dataset.stat]=e.value;
      else if(e.dataset.w){const w=e.dataset.w;if(e.checked&&!m.weapons.includes(w))m.weapons.push(w);if(!e.checked)m.weapons=m.weapons.filter(x=>x!==w);}
    });
    ed.querySelectorAll("[data-wi]").forEach(e=>{const w=U.weapons[+e.dataset.wi];w[e.dataset.k]=e.value;});
    ed.querySelectorAll("[data-oi]").forEach(e=>{
      const r=U._flat[+e.dataset.oi],k=e.dataset.k;
      r[k]=["mi","perN","max","points"].includes(k)?(+e.value||0):e.value;
    });
    ed.querySelectorAll("[data-ai]").forEach(e=>{const a=U.abilities[+e.dataset.ai];a[e.dataset.k]=e.value;});
    if(U.id==="новый_юнит"||!U.id)U.id=slug(U.name);
  }
}

$("#btnNewFac").onclick=async()=>{
  const name=prompt("Название фракции:");if(!name)return;
  const f={id:slug(name),name,description:"",units:[]};
  await api("/api/faction/save",f);await load();toast("Фракция создана: "+name);
};
$("#btnPublish").onclick=async()=>{
  const b=$("#btnPublish");b.disabled=true;b.textContent="⇪ Публикация…";
  const r=await api("/api/publish",{});
  b.disabled=false;b.textContent="⇪ Опубликовать в NewRecruit";
  toast((r.ok?"✅ Опубликовано на GitHub":"❌ Ошибка публикации")+"\n\n"+(r.log||"").slice(-800),9000);
};

load();
</script>
</body>
</html>
